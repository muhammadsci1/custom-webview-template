name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        if: ${{ github.event.inputs.buildType == 'debug' || github.event.inputs.buildType == '' }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.buildType == 'release' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          BUILD_TYPE="${{ github.event.inputs.buildType || 'debug' }}"
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK Artifact (Debug)
        if: ${{ github.event.inputs.buildType == 'debug' || github.event.inputs.buildType == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Upload APK Artifact (Release)
        if: ${{ github.event.inputs.buildType == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## Build Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.buildType || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ steps.apk.outputs.apk_path }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Download the APK from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY